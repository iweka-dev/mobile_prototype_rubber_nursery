name: Deploy to Ubuntu Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Rsync static PWA to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key and known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy with rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }}" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.DS_Store' \
            --exclude 'tools' \
            --exclude 'docs' \
            --exclude '*.md' \
            --exclude '.env' \
            --exclude 'data/notes.json' \
            --exclude 'data/process-mapping-audit-log.json' \
            --exclude 'data/backups/' \
            ./ \
            "${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:${{ secrets.FOLDER_PATH }}/"

      - name: Initialize runtime files and restart server
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }} \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
          set -e
          cd "${{ secrets.FOLDER_PATH }}"

          # Inisialisasi data/notes.json dari template jika belum ada
          if [ ! -f data/notes.json ]; then
            cp data/notes.example.json data/notes.json
            echo "[Deploy] data/notes.json diinisialisasi dari template."
          else
            echo "[Deploy] data/notes.json sudah ada, tidak ditimpa."
          fi

          # Install dependencies baru jika ada
          npm install --production --silent

          # Restart atau start server dengan PM2
          if pm2 list | grep -q "sigma-nursery"; then
            pm2 restart sigma-nursery --update-env
            echo "[Deploy] Server sigma-nursery direstart."
          else
            pm2 start server.js --name "sigma-nursery" --update-env
            echo "[Deploy] Server sigma-nursery distart."
          fi

          pm2 save --force
          echo "[Deploy] Selesai."
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

